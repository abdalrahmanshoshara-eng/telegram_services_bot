<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Installed by the Dockerfile as /etc/fonts/local.conf for the Office-to-PDF service.

  Office files ask for Microsoft and commercial fonts that cannot be shipped.
  Each is mapped to a free font with the same Latin metrics first (so line
  breaks in English match Word) and a close Arabic design second (used for the
  Arabic letters the Latin font lacks). The Noto "UI" Arabic fonts are used
  because their line height is close to Arial's; the plain Noto Arabic fonts
  added a page every few pages in tests on real documents.
-->
<fontconfig>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family><family>Noto Sans Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family><family>Noto Sans Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>DejaVu Sans</family><family>Noto Sans Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family><family>Noto Sans Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family><family>Noto Sans Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Sakkal Majalla</family><prefer><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Arabic Typesetting</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Hacen Tunisia</family><prefer><family>Noto Sans Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Hacen Tunisia Lt</family><prefer><family>Noto Sans Arabic UI</family></prefer></alias>
  <!-- Arabic text in a document that names no Arabic font would otherwise get
       DejaVu Sans, the system default, which is far wider than Arial. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic UI</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic UI</string></edit>
  </match>
  <!-- The Syrian identity font (assets/syid/fonts) as documents name it. -->
  <match target="pattern">
    <test name="family"><string>Hayyakum Allah Medium</string></test>
    <edit name="family" mode="assign" binding="same"><string>Hayyakum Allah</string></edit>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
</fontconfig>
